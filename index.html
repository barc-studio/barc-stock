const SHIP_COLOR={BL:'BL',IV:'IV',BK:'BK',OR:'OR',SIV:'SI',SI:'SI',GR:'GR',OFF:'OFF',SKB:'SB',SB:'SB',PK:'PI',PI:'PI',RD:'RE',RE:'RE',YEL:'YE',YE:'YE',BLUE:'BL',IVORY:'IV',BLACK:'BK',ORANGE:'OR',SILVER:'SI',GREEN:'GR',RED:'RE',PINK:'PI',YELLOW:'YE',SKYBLUE:'SB',오프화이트:'OFF',아이보리:'IV',블루:'BL',그린:'GR',블랙:'BK',레드:'RE',실버:'SI',오렌지:'OR',스카이블루:'SB',핑크:'PI',옐로우:'YE'};
function matchShipment(prod,col){
  const name=String(prod||'').trim().toUpperCase().replace(/\s+/g,' ');
  const raw=String(col||'').trim().toUpperCase().replace(/\s+/g,'').replace(/／/g,'/');
  const components=raw.split(/[\/,+]/).filter(Boolean).map(x=>SHIP_COLOR[x]||null);
  if(!components.length||components.some(x=>!x))return {reason:'색상 코드를 확인해 주세요'};
  const segment=c=>({RE:'RED',SI:'SILVER',BL:'BLUE',IV:'IVORY',GR:'GREEN',BK:'BLACK'}[c]||c);
  let key=null;
  let matched=name.match(/(?:^|\b)TEUM\s*(640\.2|320\.2|335\.2|330\.3|320|215|160|110)\b/);
  if(matched){
    if(components.length===1)key='TEUM '+matched[1]+' '+segment(components[0]);
    else if(components[0]==='SI'&&components[1]==='BK'){
      const coverChoice=raw.match(/(?:BLACK|BK|블랙).*2$/)||raw.includes('실버/블랙2');
      key='TEUM '+matched[1]+' SILVER/BLACK'+(matched[1].includes('.')?(coverChoice?'2':'1'):'');
    }else key='TEUM '+matched[1]+' '+components.map(segment).join('/');
    if(BOMS[key])return {key,bom:BOMS[key]};
    return {reason:'등록된 TEUM 세트 옵션이 없습니다',candidate:key};
  }
  const item=name.match(/\b(NLC|KB1|FS1|TSL)\b/);
  if(!item)return {reason:'제품명을 인식하지 못했습니다'};
  if(components.length!==1)return {reason:'단일 제품에 혼합 색상이 입력됐습니다'};
  key=item[1]+'-'+components[0];
  if(!(key in SEED))return {reason:'등록되지 않은 제품/색상 옵션',candidate:key};
  return {key,bom:{[key]:1}};
}

    result+='<div class="cards">'+[['전체 행',preview.rows.length],['매칭 완료',ok.length],['확인 필요',bad],['차감 품목',Object.keys(aggregate).length]].map(([k,v])=>'<div class="card"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>').join('')+'</div>';
    result+='<div class="panel"><div class="panel-head"><h2>출고 미리보기</h2><span class="minor">'+esc(preview.filename)+'</span></div><div class="table-scroll"><table><thead><tr><th>엑셀 행</th><th>품목명</th><th>색상</th><th class="num">수량</th><th>매칭 결과</th></tr></thead><tbody>'+preview.rows.map(r=>'<tr><td>'+r.row+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.color)+'</td><td class="num">'+r.qty+'</td><td>'+(r.match.key?esc(displaySku(r.match.key)):'<span class="smallwarn">'+esc(r.match.reason)+'</span>')+'</td></tr>').join('')+'</tbody></table></div>';
    if(insufficient.length)result+='<p class="smallwarn">재고 부족: '+insufficient.map(([sku,n])=>esc(displaySku(sku))+' 필요 '+n+' / 보유 '+(inv[sku]?.normal??0)).join(' · ')+'</p>';
    if(dupe)result+='<p class="smallwarn">이미 확정한 동일 파일입니다. 중복 출고할 수 없습니다.</p>';
    if(bad)result+='<p class="smallwarn">매칭되지 않은 '+bad+'행이 있습니다. 엑셀의 상품 표기를 확인한 후 다시 업로드해 주세요.</p>';
    result+='<div class="actions"><button class="btn" id="shipmentConfirm" '+(ready?'':'disabled')+'>확인 후 '+ok.reduce((n,r)=>n+r.qty,0)+'개 일괄 출고 확정 →</button></div></div>';
    result+='<div class="panel"><h2>실제 차감될 구성 품목</h2><div class="table-scroll"><table><thead><tr><th>부품/완제품</th><th class="num">차감 예정</th><th class="num">현재 재고</th></tr></thead><tbody>'+Object.entries(aggregate).map(([sku,n])=>'<tr><td>'+esc(displaySku(sku))+'</td><td class="num">'+n+'</td><td class="num">'+(inv[sku]?.normal??'—')+'</td></tr>').join('')+'</tbody></table></div></div>';
  }
  result+='<div class="panel"><div class="panel-head"><h2>이전에 확정한 택배 파일</h2><button class="btn secondary" type="button" id="toggleShipmentHistory">'+(shipmentHistoryOpen?'기록 닫기':'확정 택배파일 보기 ('+done.length+')')+'</button></div>';
  if(shipmentHistoryOpen){const filtered=done.filter(x=>periodMatch(x,shipmentYear,shipmentMonth));result+=periodControls(done,'shipment',shipmentYear,shipmentMonth)+(filtered.length?filtered.slice().reverse().map(x=>'<div class="line"><div>'+esc(x.filename)+'<div class="minor">'+esc(x.date)+'</div></div><strong>'+x.quantity+'개 / '+x.rows+'행</strong></div>').join(''):'<div class="empty">선택한 기간에 확정된 택배 파일이 없습니다.</div>')}
  result+='</div>';
  return result;
}
async function parseShipment(file){
 if(!window.XLSX){toast('엑셀 파일 분석 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.',true);return}
 try{
   const buf=await file.arrayBuffer(), bytes=new Uint8Array(buf);
   let h=2166136261;for(let i=0;i<bytes.length;i++)h=Math.imul(h^bytes[i],16777619)>>>0;
   const fingerprint=String(h)+':'+bytes.length;
   const book=XLSX.read(bytes,{type:'array',cellDates:false});
   const sheet=book.Sheets[book.SheetNames[0]];
   const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});
   const extracted=[];
   for(let i=0;i<rows.length;i++){
     const x=rows[i],name=String(x[9]??'').trim(),color=String(x[10]??'').trim(),value=x[12];
     if(!name&&!color)continue;
     const n=Number(String(value).replace(/,/g,'').trim());
     const possible=/\b(TEUM|NLC|KB1|FS1|TSL)\b/i.test(name);
     if(!possible)continue;
     if(!Number.isInteger(n)||n<=0){extracted.push({row:i+1,name,color,qty:0,match:{reason:'수량이 비어 있거나 올바르지 않습니다'}});continue}
     extracted.push({row:i+1,name,color,qty:n,match:matchShipment(name,color)});
   }
   shipmentPreview={filename:file.name,fingerprint,rows:extracted};
   view();if(!extracted.length)toast('인식 가능한 상품 행이 없습니다. J/K/M열 형식을 확인하세요.',true);
   else toast(extracted.length+'개 주문 행을 분석했습니다. 출고 내용을 확인하세요.');
 }catch(error){toast('엑셀 분석 오류: '+String(error.message||error),true)}
}
function confirmShipment(){
 const p=shipmentPreview;if(!p||!p.rows.length)return;
 if(state.imports.some(x=>x.fingerprint===p.fingerprint)){toast('이미 반영한 택배 파일입니다.',true);return}
 if(p.rows.some(x=>!x.match?.key)){toast('미매칭 행을 모두 해결한 뒤 확정하세요.',true);return}
 let inv=inventory(),totals={};
 for(const r of p.rows)for(const [sku,n] of Object.entries(r.match.bom))totals[sku]=(totals[sku]||0)+n*r.qty;
 if(Object.entries(totals).some(([sku,n])=>!inv[sku]||inv[sku].normal<n)){toast('재고 부족 품목이 있습니다.',true);return}
 if(!confirm(p.rows.length+'건, 총 '+p.rows.reduce((a,r)=>a+r.qty,0)+'개를 출고 확정할까요?'))return;
 const movement={id:'bulk-'+Date.now()+'-'+Math.random().toString(36).slice(2),date:dateNow(),option:'택배 일괄 출고 ('+p.filename+')',type:'출고',qty:p.rows.reduce((a,r)=>a+r.qty,0),lines:Object.entries(totals).map(([sku,n])=>({sku,normal:-n,grade:0})),worker:'택배 엑셀',memo:'택배 '+p.rows.length+'건'};
 const mark={fingerprint:p.fingerprint,filename:p.filename,date:dateNow(),quantity:movement.qty,rows:p.rows.length};
 state.movements.push(movement);state.imports.push(mark);
 if(!store()){state.movements.pop();state.imports.pop();return}
 shipmentPreview=null;view();toast('택배 '+mark.rows+'건 · '+mark.quantity+'개 출고 완료');
}

function historyPage(){return '<div class="panel"><div class="panel-head"><h2>History & Data Backup</h2><span class="minor">이 브라우저의 데모 데이터</span></div><div class="actions"><button class="btn secondary" id="backup">전체 테스트 백업 (.json)</button><button class="btn secondary" id="reset">테스트 초기화</button></div><div class="table-scroll" style="margin-top:20px"><table><thead><tr><th>날짜</th><th>품목</th><th>유형</th><th class="num">수량</th><th>담당자</th></tr></thead><tbody>'+(state.movements.slice().reverse().map(m=>'<tr><td>'+esc(m.date)+'</td><td>'+esc(m.option)+'</td><td>'+esc(m.type)+'</td><td class="num">'+m.qty+'</td><td>'+esc(m.worker)+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">변경 이력이 없습니다.</td></tr>')+'</tbody></table></div></div>'}
function download(name,text){let url=URL.createObjectURL(new Blob([text],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),800)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;view();if(page==='movement')fillMove();if(page==='incoming')fillOrder()}else if(b.dataset.filter){filter=b.dataset.filter;search='';view()}else if(b.dataset.setFilter){setFilter=b.dataset.setFilter;view()}else if(b.dataset.complete){let o=state.orders.find(o=>o.id===b.dataset.complete);if(o&&o.status==='예정'&&confirm(o.sku+' '+o.qty+'개 입고 완료 처리할까요?')){o.status='완료';o.completedAt=dateNow();store();view();toast('입고 완료: '+o.sku+' × '+o.qty)}}else if(b.id==='toggleShipmentHistory'){shipmentHistoryOpen=!shipmentHistoryOpen;view()}else if(b.id==='toggleLog'){historyOpen=!historyOpen;if(!historyOpen)editId=null;view()}else if(b.dataset.editlog){editId=b.dataset.editlog;historyOpen=true;view()}else if(b.id==='cancelLog'){editId=null;view()}else if(b.id==='shipmentConfirm')confirmShipment();else if(b.id==='backup')download('barc-stock-demo-backup.json',JSON.stringify({version:2,state},null,2));else if(b.id==='reset'&&confirm('이 브라우저의 모든 테스트 기록을 삭제할까요?')){state={movements:[],orders:[],imports:[]};shipmentPreview=null;store();view();toast('테스트 기록을 초기화했습니다')}});
document.addEventListener('change',e=>{if(e.target.id==='inventorySort'){inventorySort=e.target.value;view();return}if(e.target.id==='movementYear'){movementYear=e.target.value;editId=null;view();return}if(e.target.id==='movementMonth'){movementMonth=e.target.value;editId=null;view();return}if(e.target.id==='shipmentYear'){shipmentYear=e.target.value;view();return}if(e.target.id==='shipmentMonth'){shipmentMonth=e.target.value;view();return}if(e.target.id==='moveProduct'||e.target.id==='moveKind')fillMove();if(e.target.id==='moveOption')updateRegularCover();if(e.target.id==='orderProduct')fillOrder();if(e.target.id==='shipmentFile'&&e.target.files?.[0])parseShipment(e.target.files[0])});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let pos=e.target.selectionStart;view();let el=$('search');el.focus();el.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{if(e.target.id==='editLogForm'){e.preventDefault();editLogSave(e.target);return}if(e.target.id!=='moveForm'&&e.target.id!=='orderForm')return;e.preventDefault();let f=new FormData(e.target),qty=Number(f.get('qty')),date=f.get('date');if(!date||!Number.isInteger(qty)||qty<1){toast('날짜와 수량을 확인하세요.',true);return}if(e.target.id==='orderForm'){let sku=f.get('sku');if(!(sku in SEED)){toast('입고 품목을 선택하세요.',true);return}let o={id:'po-'+Date.now()+'-'+Math.random().toString(36).slice(2),sku,qty,date,status:'예정',memo:f.get('memo')};state.orders.push(o);if(!store()){state.orders.pop();return}view();fillOrder();toast(sku+' × '+qty+'개 입고 예정 등록');return}let option=f.get('option'),type=f.get('type');if(!option){toast('판매 옵션을 선택하세요.',true);return}let bom={...(BOMS[option]||{[option]:1})};const selectedCover=regularSetCover(option);if(selectedCover&&f.get('regularCover')==='yes')bom[selectedCover]=(bom[selectedCover]||0)+1;if(BOMS[option]&&type!=='출고'){toast('판매 세트는 출고만 가능합니다.',true);return}let inv=inventory(),lines=[];for(let [sku,units] of Object.entries(bom)){let n=units*qty;if(!(sku in inv)){toast('구성 코드 오류: '+sku,true);return}let normal=0,grade=0;if(type==='입고'||type==='재고 조정(+)')normal=n;else if(type==='B급 전환'){normal=-n;grade=n}else normal=-n;if(inv[sku].normal+normal<0){toast('정상 재고 부족: '+sku+' (보유 '+inv[sku].normal+'개)',true);return}lines.push({sku,normal,grade})}let m={id:'m-'+Date.now()+'-'+Math.random().toString(36).slice(2),date,option,type,qty,lines,worker:f.get('worker'),memo:f.get('memo'),regularCover:!!(selectedCover&&f.get('regularCover')==='yes')};state.movements.push(m);if(!store()){state.movements.pop();return}view();fillMove();toast(option+' × '+qty+' · '+type+' 반영 완료')});
view();
</script></body></html>
